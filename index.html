<!----1.WAP to create a calculator use javascript 
2.use css 
3.use DOM functionality
 4.use function
 5.all the operations need to update(+,-,*,/) 
 6.use events.
------>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="calci.js"></script>
</head>
<body>
    <h1> Calculator</h1>
 <div class="container"> 
    <form>
        <div class="calculator">

        <input class="display-box" type="text" name="display" id="result">
    </div>
    <div>
        <input type="button" value="AC" onclick="clearscrean()" id="btn">
        <input type="button" value="/" onclick="display.value +='/'">
        <input type="button" value="." onclick="display.value +='.'">
    </div>
    <div>
        <input type="button" value="7" onclick="display.value +='7'">
        <input type="button" value="8" onclick="display.value +='8'">
        <input type="button" value="9" onclick="display.value +='9'">
       
    </div>
    <div>
        <input type="button" value="4" onclick="display.value +='4'">
        <input type="button" value="5" onclick="display.value +='5'">
        <input type="button" value="6" onclick="display.value +='6'">
       
    </div>
    <div>
        <input type="button" value="1" onclick="display.value +='1'">
        <input type="button" value="2" onclick="display.value +='2'">
        <input type="button" value="3" onclick="display.value +='3'">
       
    </div>
    <div>
        <input type="button" value="*" onclick="display.value +='*'">
        <input type="button" value="-" onclick="display.value +='-'">
        <input type="button" value="+" onclick="display.value +='+'">
    </div>
    <div>
        <input type="button" value="00" onclick="display.value +='00'">
        <input type="button" value="0" onclick="display.value +='0'">
        <input type="button" value="=" onclick="calculate()" id="btn">
       
    </div>
    </form>
</div>
   </div>
</body>
</html>

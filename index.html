<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form1val.css">
    <script src="form1val.js"></script>
</head>
<body>
    <h1>REGISTRATION FORM</h1>
    <form name="regForm" action="success.html" onsubmit="return validateForm()">
        <p>
            <label for="name">Name:</label>
            <input type="text" id="name" name="Name" 
                placeholder="Enter your full name" />
            <span id="name-error" class="error-message"></span>
        </p>
        <p>
            <label for ="gender">Gender:</label>
            <input type="radio" id="radio" name="Radio" placeholder="gender"/>
            <label for="male">Male</label>
            <input type="radio" id="radio" name="Radio" placeholder="gender"/>
            <label for="male">Female</label>
            <span id="gender-error" class="error-message"></span>
        </p>
        <p>
            <label for="address">Address:</label>
            <input type="text" id="address" name="Address" 
                placeholder="Enter your address" />
            <span id="address-error" class="error-message"></span>
        </p>
        <p>
            <label for="Email">Email:</label>
            <input type="text" id="email" name="Email" 
                placeholder="Enter your email id" />
            <span id="email-error" class="error-message"></span>
        </p>
        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="Password" 
                placeholder="Enter your password" />
            <span id="password-error" class="error-message"></span>
        </p>
        <p>
            <label for="mobile">Contact:</label>
            <input type="tel" id="mobile" name="Mobile" pattern="[0-9]{10}"
            placeholder="Enter your contact number"/>
            <span id="mobile-error" class="error-messagge"></span>
        </p>
       
        <p>
            <input type="submit" value="Send" name="Submit" />
            <input type="reset" value="Reset" name="Reset" />
        </p>
    </form>
</body>
</html>
